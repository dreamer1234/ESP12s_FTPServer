; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; default_envs = esp12e, esp32-c6-devkitm-1
default_envs = esp32-c6-devkitm-1

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_flags = 
	-w
	-O2
	-DESP8266
; -DESP8266 is for creating a #define so the source code knows which platform needs to be used
[env:esp32-c6-devkitm-1]
; platform = espressif32
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1
; framework = espidf
framework = arduino
; change microcontroller
board_build.mcu = esp32c6
; change MCU frequency
board_build.f_cpu = 160000000L
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = 
	-w
	-O2
	-DESP32
; -DESP32 is for creating a #define so the source code knows which platform needs to be used

